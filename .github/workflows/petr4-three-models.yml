name: PETR4 three model benchmark
on:
  pull_request:
    paths:
      - 'research/petr4_three_models.py'
      - '.github/workflows/petr4-three-models.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific runtime
        run: |
          python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3'
          python -m pip install 'torch>=2.2,<3' --index-url https://download.pytorch.org/whl/cpu
      - name: Verify syntax and imports
        run: |
          python -m py_compile research/petr4_three_models.py research/petr4_neural_backtest.py
          PYTHONPATH=research python -c "import petr4_three_models; print('module ok')"
      - name: Run matched PETR4 ATR / intermarket MACD / ATR plus neural Elliott
        shell: bash
        run: |
          set -o pipefail
          python -u research/petr4_three_models.py --epochs 8 --fee 13 --out research/three_model_runs             | tee research/three_models_execution.log
          test -s research/three_model_runs/report.json
          test -s research/three_model_runs/paired_neural_predictions.csv
      - name: Export complete sources, weights, forecasts, and risk metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PETR4-three-models-${{ github.run_id }}
          path: |
            research/three_model_runs/
            research/three_models_execution.log
          retention-days: 30
          if-no-files-found: warn
