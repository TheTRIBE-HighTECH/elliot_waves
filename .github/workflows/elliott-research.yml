name: Elliott counts archive and model research

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      train:
        description: 'Train/evaluate candidate neural models using real OHLCV'
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - 'research/**'
      - '.github/workflows/elliott-research.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight graph-test dependencies
        run: python -m pip install numpy pandas
      - name: Test annotation and collector schema
        run: |
          python -m compileall -q research
          python -m unittest discover -s research -p 'test_*.py' -v

  snapshot-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify live Atlas index and three market snapshots
        run: python research/atlas_snapshots.py --out research/snapshots --max-markets 3 --spacing 1
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-snapshot-smoke-${{ github.run_id }}
          path: research/snapshots/
          retention-days: 30

  daily-snapshot:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.train)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect daily provider calls
        run: python research/atlas_snapshots.py --out research/snapshots --max-markets 100 --spacing 1
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-calls-${{ github.run_id }}
          path: research/snapshots/
          retention-days: 30
          if-no-files-found: error

  train-and-benchmark:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.train)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific dependencies
        run: pip install -r research/requirements.txt
      - name: Download historical BTC/USDT data (2024-2025)
        run: python research/download_binance.py --symbols BTCUSDT ETHUSDT SOLUSDT AVAXUSDT ADAUSDT LINKUSDT MANAUSDT HBARUSDT DOTUSDT XRPUSDT SUIUSDT --start 2024-01 --end 2025-12 --out research/datasets
      - name: Compare candidate networks on identical chronological splits
        run: for asset in BTCUSDT ETHUSDT SOLUSDT AVAXUSDT ADAUSDT LINKUSDT MANAUSDT HBARUSDT DOTUSDT XRPUSDT SUIUSDT; do python research/compare_nn.py --csv research/datasets/${asset}_1h.csv --epochs 6 --out research/runs/${asset}; done
      - name: Rank candidate architectures across assets using validation only
        run: python research/rank_models.py research/runs/{BTCUSDT,ETHUSDT,SOLUSDT,AVAXUSDT,ADAUSDT,LINKUSDT,MANAUSDT,HBARUSDT,DOTUSDT,XRPUSDT,SUIUSDT}/report.json --out research/runs/ranking.json
      - uses: actions/upload-artifact@v4
        with:
          name: elliott-model-benchmark-${{ github.run_id }}
          path: research/runs/
          retention-days: 30
          if-no-files-found: error

  graph-fusion-benchmark:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.train)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install neural dependencies
        run: python -m pip install -r research/requirements.txt
      - name: Test graph causality and neural tensor shapes
        run: python -m unittest discover -s research -p 'test_*.py' -v
      - name: Retrieve 2024–2025 market OHLCV for graph pilot
        run: python research/download_binance.py --symbols BTCUSDT --start 2024-01 --end 2025-12 --out research/datasets
      - name: Obtain real historical HN reply trees (Bitcoin)
        run: python research/hn_reply_graph.py --assets BTCUSDT --start 2024-01 --end 2025-12 --stories-month 3 --max-nodes-story 200 --spacing 0.15 --out research/datasets/hn_graph
      - name: Retrieve COVID-19 discussion sample for later graph-validation study
        run: python research/hn_reply_graph.py --assets COVID --start 2020-03 --end 2020-03 --stories-month 3 --max-nodes-story 200 --spacing 0.15 --out research/datasets/hn_covid_2020
      - name: Train matched price-only and real-graph fusion, two clocks
        run: python research/graph_message_passing.py --csv research/datasets/BTCUSDT_1h.csv --events research/datasets/hn_graph/hn_reply_events.csv --asset BTCUSDT --clock-source graph --epochs 8 --out research/runs/graph_fusion_BTC
      - uses: actions/upload-artifact@v4
        with:
          name: elliott-real-temporal-graph-${{ github.run_id }}
          path: |
            research/runs/graph_fusion_BTC/
            research/datasets/hn_graph/
            research/datasets/hn_covid_2020/
          retention-days: 30
          if-no-files-found: error
