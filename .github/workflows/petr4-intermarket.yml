name: PETR4 combinatorial cross-market strategy research
on:
  pull_request:
    paths:
      - 'research/petr4_intermarket_combinatorial.py'
      - '.github/workflows/petr4-intermarket.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  intermarket-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical runtime
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3'
      - name: Verify code syntax
        run: |
          python -m py_compile research/petr4_mql_catalog.py
          python -m py_compile research/petr4_intermarket_combinatorial.py
      - name: Run lagged intermarket combinations on real PETR4 data
        shell: bash
        run: |
          set -o pipefail
          python -u research/petr4_intermarket_combinatorial.py \
            --fee 13 --out research/intermarket_runs \
            | tee research/intermarket_execution.log
          test -s research/intermarket_runs/report.json
          test -s research/intermarket_runs/all_eligible_combinations.csv
      - name: Upload price source, macro source, full search, correlations and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PETR4-intermarket-correlation-${{ github.run_id }}
          path: |
            research/intermarket_runs/
            research/intermarket_execution.log
          retention-days: 30
          if-no-files-found: warn
